<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{backoffice/layout/default}">
<head>
    <title>Users - Backoffice</title>
</head>
<body>
    <div layout:fragment="pageTitle">Users</div>
    <div layout:fragment="content">

        <!-- Flash messages -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Toolbar -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <form class="d-flex gap-2" method="get" th:action="@{/backoffice/admin/users}">
                <input type="text" class="form-control" name="search" placeholder="Search users..."
                       th:value="${search}" style="width: 250px;">
                <select class="form-select" name="roleId" style="width: 180px;">
                    <option value="">All Roles</option>
                    <option th:each="r : ${allRoles}" th:value="${r.id}" th:text="${r.name}"
                            th:selected="${roleId != null && roleId == r.id}"></option>
                </select>
                <button type="submit" class="btn btn-outline-secondary">
                    <span class="material-symbols-outlined" style="vertical-align: middle; font-size: 18px;">search</span>
                </button>
            </form>
            <a th:href="@{/backoffice/admin/users/new}" class="btn btn-primary">
                <span class="material-symbols-outlined me-1" style="vertical-align: middle; font-size: 18px;">person_add</span>
                New User
            </a>
        </div>

        <!-- Users table -->
        <div class="bo-module-card p-0">
            <table class="table table-hover mb-0">
                <thead>
                    <tr>
                        <th>Username</th>
                        <th>Display Name</th>
                        <th>Roles</th>
                        <th>Created</th>
                        <th class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="u : ${users.content}">
                        <td>
                            <span class="fw-semibold" th:text="${u.username}"></span>
                        </td>
                        <td th:text="${u.displayName}"></td>
                        <td>
                            <span th:each="r : ${u.roles}" class="badge bg-primary me-1" th:text="${r.name}"></span>
                        </td>
                        <td th:text="${#temporals.format(u.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                        <td class="text-end">
                            <a th:href="@{/backoffice/admin/users/{id}/edit(id=${u.id})}"
                               class="btn btn-sm btn-outline-secondary" title="Edit">
                                <span class="material-symbols-outlined" style="font-size: 16px;">edit</span>
                            </a>
                            <form th:if="${u.id != #authentication.principal.userId}"
                                  th:action="@{/backoffice/admin/users/{id}/delete(id=${u.id})}"
                                  method="post" class="d-inline"
                                  onsubmit="return confirm('Are you sure you want to delete this user?')">
                                <button type="submit" class="btn btn-sm btn-outline-danger" title="Delete">
                                    <span class="material-symbols-outlined" style="font-size: 16px;">delete</span>
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${users.content.isEmpty()}">
                        <td colspan="5" class="text-center text-muted py-4">No users found</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <nav th:if="${users.totalPages > 1}" class="mt-3">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${users.first} ? 'disabled'">
                    <a class="page-link" th:href="@{/backoffice/admin/users(search=${search}, roleId=${roleId}, page=${users.number - 1})}">Previous</a>
                </li>
                <li th:each="i : ${#numbers.sequence(0, users.totalPages - 1)}"
                    class="page-item" th:classappend="${i == users.number} ? 'active'">
                    <a class="page-link" th:href="@{/backoffice/admin/users(search=${search}, roleId=${roleId}, page=${i})}" th:text="${i + 1}"></a>
                </li>
                <li class="page-item" th:classappend="${users.last} ? 'disabled'">
                    <a class="page-link" th:href="@{/backoffice/admin/users(search=${search}, roleId=${roleId}, page=${users.number + 1})}">Next</a>
                </li>
            </ul>
        </nav>

    </div>
</body>
</html>
