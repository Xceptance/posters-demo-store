<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head><title>Shopping Cart</title></head>
<body>
<div layout:fragment="content">
    <div class="container mt-4">
        <h1 th:text="#{titleShoppingCart}">Shopping Cart</h1>
        <div id="cart-content">
            <div th:if="${cart != null and not #lists.isEmpty(cart.products)}">
                <table class="table" id="cart-table">
                    <thead>
                        <tr><th th:text="#{labelProduct}">Product</th><th th:text="#{labelSize}">Size</th><th th:text="#{labelFinish}">Finish</th><th th:text="#{labelPrice}">Price</th><th th:text="#{labelQuantity}">Qty</th><th th:text="#{labelTotal}">Total</th><th></th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="cp : ${cart.products}" th:id="'cart-item-' + ${cp.id}" class="js-cart-product">
                            <td class="js-cart-product-description">
                                <a th:href="@{'/' + ${urlLocale} + '/product/' + ${cp.product.name.getText(urlLocale)} + '?productId=' + ${cp.product.id}}"
                                   th:text="${cp.product.name.getText(urlLocale)}">Product</a>
                            </td>
                            <td th:text="${cp.size.width + 'x' + cp.size.height}">16x12</td>
                            <td th:text="${cp.finish}">matte</td>
                            <td th:text="${#numbers.formatCurrency(cp.price)}">$0.00</td>
                            <td>
                                <input type="number" th:value="${cp.productCount}" min="1" max="999"
                                       class="form-control form-control-sm cart-qty-input"
                                       style="width:70px" th:id="'qty-' + ${cp.id}"
                                       name="productCount"
                                       hx-trigger="change"
                                       th:hx-post="@{'/' + ${urlLocale} + '/updateProductCount?cartProductId=' + ${cp.id}}"
                                       hx-target="#cart-content"
                                       hx-swap="innerHTML"
                                       hx-include="this"/>
                            </td>
                            <td><span th:text="${#numbers.formatCurrency(cp.totalProductPrice)}" th:id="'total-' + ${cp.id}">$0.00</span></td>
                            <td>
                                <button class="btn btn-sm btn-danger cart-remove-btn"
                                        hx-confirm="Remove this item from your cart?"
                                        th:hx-post="@{'/' + ${urlLocale} + '/deleteFromCart?cartProductId=' + ${cp.id}}"
                                        hx-target="#cart-content"
                                        hx-swap="innerHTML" th:text="#{buttonRemove}">Remove</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <div class="row justify-content-end">
                    <div class="col-md-4">
                        <table class="table">
                            <tr><td th:text="#{labelSubtotal}">Subtotal:</td><td><span th:text="${#numbers.formatCurrency(cart.subTotalPrice)}" id="cart-subtotal">$0.00</span></td></tr>
                            <tr><td>Tax (<span th:text="${cart.taxAsString}">6.0</span>%):</td><td><span th:text="${#numbers.formatCurrency(cart.totalTaxPrice)}" id="cart-tax">$0.00</span></td></tr>
                            <tr><td th:text="#{labelShipping}">Shipping:</td><td><span th:text="${#numbers.formatCurrency(cart.shippingCosts)}">$0.00</span></td></tr>
                            <tr><th>Total:</th><th><span th:text="${#numbers.formatCurrency(cart.totalPrice)}" id="cart-total">$0.00</span></th></tr>
                        </table>
                        <a th:href="@{'/' + ${urlLocale} + '/checkout/shippingAddress'}" class="btn btn-primary" id="btn-checkout" th:text="#{buttonCheckout}">Checkout</a>
                    </div>
                </div>
            </div>
            <div th:if="${cart == null or #lists.isEmpty(cart.products)}">
                <p th:text="#{labelYourCartEmpty}">Your cart is empty.</p>
                <a th:href="@{'/' + ${urlLocale} + '/'}" class="btn btn-primary" th:text="#{buttonContinueShopping}">Continue Shopping</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
