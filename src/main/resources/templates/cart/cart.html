<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head><title>Shopping Cart</title></head>
<body>
<div layout:fragment="content">
    <div class="container mt-4">
        <h1>Shopping Cart</h1>
        <div th:if="${cart != null and not #lists.isEmpty(cart.products)}">
            <table class="table" id="cart-table">
                <thead>
                    <tr><th>Product</th><th>Size</th><th>Finish</th><th>Price</th><th>Qty</th><th>Total</th><th></th></tr>
                </thead>
                <tbody>
                    <tr th:each="cp : ${cart.products}" th:id="'cart-item-' + ${cp.id}">
                        <td>
                            <a th:href="@{'/' + ${urlLocale} + '/productDetail/' + ${cp.product.name.getText(urlLocale)} + '?productId=' + ${cp.product.id}}"
                               th:text="${cp.product.name.getText(urlLocale)}">Product</a>
                        </td>
                        <td th:text="${cp.size.width + 'x' + cp.size.height}">16x12</td>
                        <td th:text="${cp.finish}">matte</td>
                        <td th:text="${#numbers.formatCurrency(cp.price)}">$0.00</td>
                        <td>
                            <input type="number" th:value="${cp.productCount}" min="1" max="999"
                                   class="form-control form-control-sm cart-qty-input"
                                   style="width:70px" th:id="'qty-' + ${cp.id}"
                                   th:data-cpid="${cp.id}"/>
                        </td>
                        <td><span th:text="${#numbers.formatCurrency(cp.totalProductPrice)}" th:id="'total-' + ${cp.id}">$0.00</span></td>
                        <td><button class="btn btn-sm btn-danger cart-remove-btn" th:data-cpid="${cp.id}">Remove</button></td>
                    </tr>
                </tbody>
            </table>
            <div class="row justify-content-end">
                <div class="col-md-4">
                    <table class="table">
                        <tr><td>Subtotal:</td><td><span th:text="${#numbers.formatCurrency(cart.subTotalPrice)}" id="cart-subtotal">$0.00</span></td></tr>
                        <tr><td>Tax (<span th:text="${cart.taxAsString}">6.0</span>%):</td><td><span th:text="${#numbers.formatCurrency(cart.totalTaxPrice)}" id="cart-tax">$0.00</span></td></tr>
                        <tr><td>Shipping:</td><td><span th:text="${#numbers.formatCurrency(cart.shippingCosts)}">$0.00</span></td></tr>
                        <tr><th>Total:</th><th><span th:text="${#numbers.formatCurrency(cart.totalPrice)}" id="cart-total">$0.00</span></th></tr>
                    </table>
                    <a th:href="@{'/' + ${urlLocale} + '/checkout/shippingAddress'}" class="btn btn-primary" id="btn-checkout">Checkout</a>
                </div>
            </div>
        </div>
        <div th:if="${cart == null or #lists.isEmpty(cart.products)}">
            <p>Your cart is empty.</p>
            <a th:href="@{'/' + ${urlLocale} + '/'}" class="btn btn-primary">Continue Shopping</a>
        </div>
    </div>
    <script th:inline="javascript">
        var CART_LOCALE = [[${urlLocale}]];

        document.addEventListener('DOMContentLoaded', function() {
            // Quantity change handlers
            document.querySelectorAll('.cart-qty-input').forEach(function(input) {
                input.addEventListener('change', function() {
                    var cpId = this.getAttribute('data-cpid');
                    fetch('/' + CART_LOCALE + '/updateProductCount', {
                        method: 'POST',
                        body: new URLSearchParams({cartProductId: cpId, productCount: this.value})
                    }).then(r => r.json()).then(data => { if(data.success) location.reload(); });
                });
            });
            // Remove button handlers
            document.querySelectorAll('.cart-remove-btn').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    var cpId = this.getAttribute('data-cpid');
                    fetch('/' + CART_LOCALE + '/deleteFromCart', {
                        method: 'POST',
                        body: new URLSearchParams({cartProductId: cpId})
                    }).then(r => r.json()).then(data => { if(data.success) location.reload(); });
                });
            });
        });
    </script>
</div>
</body>
</html>
