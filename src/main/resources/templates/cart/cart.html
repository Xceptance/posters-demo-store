<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head><title>Shopping Cart</title></head>
<body>
<div layout:fragment="content">
    <div class="container mt-4">
        <h1 th:text="#{titleShoppingCart}">Shopping Cart</h1>
        <div id="cart-content">
            <div th:if="${cart != null and not #lists.isEmpty(cart.products)}" class="row g-4">
                <!-- Left: Items -->
                <div class="col-lg-8">
                    <div class="table-responsive">
                        <table class="table align-middle" id="cart-table">
                            <thead>
                                <tr class="text-uppercase text-muted" style="font-size: 0.85rem;"><th th:text="#{labelProduct}">Product</th><th th:text="#{labelSize}">Size</th><th th:text="#{labelFinish}">Finish</th><th th:text="#{labelPrice}">Price</th><th th:text="#{labelQuantity}">Qty</th><th th:text="#{labelTotal}">Total</th><th></th></tr>
                            </thead>
                            <tbody>
                                <tr th:each="cp : ${cart.products}" th:id="'cart-item-' + ${cp.id}" class="js-cart-product">
                                    <td class="js-cart-product-description fw-bold">
                                        <a th:href="@{'/' + ${urlLocale} + '/product/' + ${cp.product.name.getText(urlLocale)} + '?productId=' + ${cp.product.id}}"
                                           th:text="${cp.product.name.getText(urlLocale)}" class="text-dark text-decoration-none">Product</a>
                                    </td>
                                    <td th:text="${cp.size.width + 'x' + cp.size.height}">16x12</td>
                                    <td th:text="${cp.finish}">matte</td>
                                    <td th:text="${#numbers.formatCurrency(cp.price)}">$0.00</td>
                                    <td>
                                        <input type="number" th:value="${cp.productCount}" min="1" max="999"
                                               class="form-control form-control-sm cart-qty-input"
                                               style="width:70px" th:id="'qty-' + ${cp.id}"
                                               name="productCount"
                                               hx-trigger="change"
                                               th:hx-post="@{'/' + ${urlLocale} + '/updateProductCount?cartProductId=' + ${cp.id}}"
                                               hx-target="#cart-content"
                                               hx-swap="innerHTML"
                                               hx-include="this"/>
                                    </td>
                                    <td><span class="fw-bold" th:text="${#numbers.formatCurrency(cp.totalProductPrice)}" th:id="'total-' + ${cp.id}">$0.00</span></td>
                                    <td class="text-end">
                                        <button class="btn btn-sm btn-outline-danger cart-remove-btn"
                                                th:hx-confirm="#{confirmRemoveFromCart}"
                                                th:hx-post="@{'/' + ${urlLocale} + '/deleteFromCart?cartProductId=' + ${cp.id}}"
                                                hx-target="#cart-content"
                                                hx-swap="innerHTML" title="Remove">
                                            <i class="bi bi-trash3"></i>
                                        </button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                
                <!-- Right: Summary Card -->
                <div class="col-lg-4">
                    <div class="card border-0 shadow-sm bg-light" style="position: sticky; top: 100px;">
                        <div class="card-body p-4">
                            <h3 class="card-title h5 mb-3 fw-bold">Order Summary</h3>
                            <table class="table table-borderless mb-4">
                                <tr class="border-bottom"><td class="text-muted ps-0" th:text="#{labelSubtotal}">Subtotal:</td><td class="text-end pe-0"><span th:text="${#numbers.formatCurrency(cart.subTotalPrice)}" id="cart-subtotal">$0.00</span></td></tr>
                                <tr><td class="text-muted ps-0">Tax (<span th:text="${cart.taxAsString}">6.0</span>%):</td><td class="text-end pe-0"><span th:text="${#numbers.formatCurrency(cart.totalTaxPrice)}" id="cart-tax">$0.00</span></td></tr>
                                <tr class="border-bottom"><td class="text-muted ps-0" th:text="#{labelShipping}">Shipping:</td><td class="text-end pe-0"><span th:text="${#numbers.formatCurrency(cart.shippingCosts)}">$0.00</span></td></tr>
                                <tr><th class="ps-0 fs-5 pt-3">Total:</th><th class="text-end pe-0 fs-5 pt-3"><span class="text-danger" th:text="${#numbers.formatCurrency(cart.totalPrice)}" id="cart-total">$0.00</span></th></tr>
                            </table>
                            <a th:href="@{'/' + ${urlLocale} + '/checkout/shippingAddress'}" class="btn btn-primary w-100 btn-lg" id="btn-checkout" th:text="#{buttonCheckout}">Checkout</a>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Empty State -->
            <div th:if="${cart == null or #lists.isEmpty(cart.products)}" class="text-center py-5 mt-5">
                <i class="bi bi-cart-x text-muted mb-3 d-block" style="font-size: 5rem; opacity: 0.5;"></i>
                <h2 class="mb-3" style="font-family: 'Rokkitt', serif;" th:text="#{labelYourCartEmpty}">Your cart is empty.</h2>
                <p class="text-muted mb-4 fs-5">Looks like you haven't added any posters to your cart yet.</p>
                <a th:href="@{'/' + ${urlLocale} + '/'}" class="btn btn-primary btn-lg px-5 shadow-sm" th:text="#{buttonContinueShopping}">Continue Shopping</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
