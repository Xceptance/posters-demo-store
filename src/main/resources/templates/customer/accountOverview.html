<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head><title>My Account</title></head>
<body>
<main layout:fragment="content">
    <div class="container mt-4" th:if="${customer != null}">
        <h1>Account Overview</h1>
        <div class="row">
            <div class="col-md-6">
                <div class="card mb-3">
                    <div class="card-body">
                        <h5 class="card-title">Personal Information</h5>
                        <form th:action="@{'/' + ${urlLocale} + '/updateAccount'}" method="post" id="account-form">
                            <div class="mb-3">
                                <label class="form-label">First Name</label>
                                <input type="text" class="form-control" name="firstName" th:value="${customer.firstName}"/>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Last Name</label>
                                <input type="text" class="form-control" name="name" th:value="${customer.name}"/>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" name="email" th:value="${customer.email}"/>
                            </div>
                            <button type="submit" class="btn btn-primary" id="btn-update-account">Update</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Order History</h5>
                        <a th:href="@{'/' + ${urlLocale} + '/orderOverview'}" class="btn btn-outline-primary" id="btn-order-history">
                            View Orders
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
