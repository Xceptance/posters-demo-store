<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head><title>Posters - Category</title></head>
<body>
<main layout:fragment="content">
    <div class="container mt-4">
        <h1 th:text="${categoryName}">Category</h1>
        <div class="row" id="product-list">
            <div class="col-md-3 col-sm-6 mb-4" th:each="product : ${products}">
                <div class="card h-100" th:id="'product-' + ${product.id}">
                    <a th:href="@{'/' + ${urlLocale} + '/productDetail/' + ${product.id}}">
                        <img th:src="@{${product.imageURL}}" class="card-img-top"
                             th:alt="${product.defaultName}"/>
                    </a>
                    <div class="card-body">
                        <h5 class="card-title">
                            <a th:href="@{'/' + ${urlLocale} + '/productDetail/' + ${product.id}}"
                               th:text="${product.defaultName}">Product</a>
                        </h5>
                        <p class="card-text">
                            <span th:text="${currency}">$</span>
                            <span th:text="${product.minimumPrice}">0.00</span>
                        </p>
                    </div>
                </div>
            </div>
        </div>
        <p th:if="${#lists.isEmpty(products)}" th:text="#{catalog.noProducts}">No products found.</p>
    </div>
</main>
</body>
</html>
