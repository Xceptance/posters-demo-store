<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head><title th:text="${product.defaultName}">Product Detail</title></head>
<body>
<div layout:fragment="content">

<div class="container mt-4" th:if="${product != null}">
    <div class="row">
        <img th:src="@{${product.largeImageURL}}"
             th:alt="${product.defaultName}"
             class="img-fluid col-lg-6 col-md-12"/>
        <div class="col-lg-6 col-md-12 mt-4">
            <form id="add-to-cart-form">
                <div class="mb-3">
                    <h3 id="product-detail-form-name" th:text="${product.defaultName}">Product Name</h3>
                </div>
                <div class="mb-3">
                    <p><span id="product-detail-form-price"
                             th:text="${currency + product.minimumPrice}">$0.00</span></p>
                </div>
                <div class="mb-3">
                    <h4 id="product-detail-form-description-overview"
                        th:text="${product.defaultDescriptionOverview}">Short Description</h4>
                </div>
                <div class="mb-3">
                    <label for="product-detail-form-description"
                           class="form-label product-detail-paragraph-label">Product Description</label>
                    <div id="product-detail-form-description"
                         th:text="${product.defaultDescriptionDetail}">Detailed description</div>
                </div>
                <div class="mb-3" th:if="${not #lists.isEmpty(product.availableSizes)}">
                    <label for="product-detail-form-size-selection" class="form-label">Select Size</label>
                    <select id="product-detail-form-size-selection" class="form-select"
                            aria-label="size selection">
                        <option th:each="pps : ${product.availableSizes}"
                                th:value="${pps.size.width + ' x ' + pps.size.height + ' ' + unitLength}"
                                th:text="${pps.size.width + ' x ' + pps.size.height + ' ' + unitLength}">
                            16 x 12 in
                        </option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="product-detail-form-style-selection" class="form-label">Select Finish</label>
                    <div id="product-detail-form-style-selection">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="finish"
                                   id="finish-matte" value="matte" checked="checked"/>
                            <label class="form-check-label" for="finish-matte">Matte</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="finish"
                                   id="finish-gloss" value="gloss"/>
                            <label class="form-check-label" for="finish-gloss">Gloss</label>
                        </div>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="product-detail-form-print-information"
                           class="form-label product-detail-paragraph-label">Print Information</label>
                    <div id="product-detail-form-print-information">
                        All posters are printed on premium, archival-quality paper with a smooth, matte or glossy finish.
                    </div>
                </div>
                <div class="mb-3 product-detail-product-id-container">
                    <label for="product-detail-form-product-id">ID:</label>
                    <div id="product-detail-form-product-id" th:text="${product.id}">1</div>
                </div>
                <div class="mb-3 d-flex justify-content-end">
                    <a id="btn-add-to-cart" class="btn btn-primary"
                       th:data-productid="${product.id}" th:data-locale="${urlLocale}">
                        <i class="icon-shopping-cart"></i> Add to Cart
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        var btn = document.getElementById('btn-add-to-cart');
        if (btn) {
            btn.addEventListener('click', function() {
                var productId = this.getAttribute('data-productid');
                var finish = document.querySelector('#add-to-cart-form input[name=finish]:checked').value;
                var size = document.querySelector('#product-detail-form-size-selection').value;
                var locale = this.getAttribute('data-locale');
                addToCart(productId, finish, size, locale);
            });
        }
    });
</script>

</div>
</body>
</html>
