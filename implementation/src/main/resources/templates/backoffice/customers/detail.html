<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{backoffice/layout/default}">
<head>
    <title>Customer Details</title>
</head>
<body>
    <div layout:fragment="pageTitle">
        Customer <span th:text="${detail.customer.customerNumber}"></span>
    </div>

    <div layout:fragment="pageActions">
        <a th:href="@{/backoffice/customers}" class="btn btn-outline-secondary">
            <span class="material-symbols-outlined align-middle me-1">arrow_back</span>
            Back to List
        </a>
    </div>

    <div layout:fragment="content">
        <div class="row g-4">
            <!-- Profile Section -->
            <div class="col-lg-4">
                <div class="bo-card h-100">
                    <div class="bo-card-header">
                        <h5 class="mb-0">Profile Summary</h5>
                    </div>
                    <div class="bo-card-body">
                        <!-- Profile Name Fragment -->
                        <div th:replace="~{backoffice/customers/fragments/profile-name-display :: profile-name-display(customer=${detail.customer})}"></div>

                        <dl class="row mb-0">
                            <dt class="col-sm-4 text-muted">Email</dt>
                            <dd class="col-sm-8" th:text="${detail.customer.email}"></dd>

                            <dt class="col-sm-4 text-muted">Created</dt>
                            <dd class="col-sm-8" th:text="${#temporals.format(detail.customer.createdAt, 'MMM dd, yyyy')}"></dd>

                            <th:block th:if="${detail.profile != null}">
                                <dt class="col-sm-4 text-muted mt-3">Last Login</dt>
                                <dd class="col-sm-8 mt-3">
                                    <span th:if="${detail.profile.lastLogin != null}" 
                                          th:text="${#temporals.format(detail.profile.lastLogin, 'MMM dd, yyyy HH:mm')}"></span>
                                    <span th:unless="${detail.profile.lastLogin != null}" class="text-muted">Never</span>
                                </dd>
                            </th:block>
                        </dl>
                    </div>
                </div>
            </div>

            <!-- Addresses Section -->
            <div class="col-lg-8">
                <div class="bo-card mb-4">
                    <div class="bo-card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Addresses</h5>
                        <button class="btn btn-sm btn-outline-primary" 
                                th:hx-get="@{/backoffice/customers/{id}/addresses/new(id=${detail.customer.id})}" 
                                hx-target="#address-form-container" 
                                hx-swap="innerHTML">Add Address</button>
                    </div>
                    <div class="bo-card-body p-0">
                        <div id="address-form-container"></div>
                        <div id="address-list-container" th:replace="~{backoffice/customers/fragments/address-list :: address-list}"></div>
                    </div>
                </div>

                <!-- Credit Cards Section -->
                <div class="bo-card">
                    <div class="bo-card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Credit Cards</h5>
                        <button class="btn btn-sm btn-outline-primary" 
                                th:hx-get="@{/backoffice/customers/{id}/credit-cards/new(id=${detail.customer.id})}" 
                                hx-target="#credit-card-form-container" 
                                hx-swap="innerHTML">Add Credit Card</button>
                    </div>
                    <div class="bo-card-body p-0">
                        <div id="credit-card-form-container"></div>
                        <div id="credit-card-list-container" th:replace="~{backoffice/customers/fragments/credit-card-list :: credit-card-list}"></div>
                    </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
