<div th:fragment="credit-card-form" class="modal fade" id="creditCardFormModal" tabindex="-1" aria-labelledby="creditCardFormModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="creditCardFormModalLabel">Add New Credit Card</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="payment-form" method="post" th:hx-post="@{/backoffice/customers/{id}/credit-cards/new(id=${customer.id})}" 
                  hx-target="#credit-card-list-container" 
                  hx-swap="outerHTML"
                  hx-on::after-request="if(event.detail.successful) bootstrap.Modal.getInstance(document.getElementById('creditCardFormModal')).hide()">
                <div class="modal-body">
                    <link rel="stylesheet" th:href="@{/assets/css/credit-card.css}"/>
                    
                    <div class="row g-3">
                        <!-- Card Number -->
                        <div class="col-12 position-relative">
                            <label class="form-label required">Card Number *</label>
                            <input type="text" class="form-control" id="cardNumber" name="cardNumber"
                                   placeholder="4111 1111 1111 1111" required
                                   autocomplete="cc-number" inputmode="numeric"
                                   maxlength="23"/>
                            <div id="vendor-display" class="position-absolute end-0 top-50 translate-middle-y pe-3" style="margin-top: 15px;">
                                <span class="cc-vendor-badge">
                                    <span id="vendor-name" class="fw-bold text-muted" style="font-size: 12px;"></span>
                                </span>
                            </div>
                        </div>

                        <!-- Cardholder Name -->
                        <div class="col-12">
                            <label class="form-label required">Name on Card *</label>
                            <input type="text" class="form-control" id="cardName" name="name"
                                   placeholder="Name on Card" required
                                   autocomplete="cc-name"/>
                        </div>

                        <!-- Expiry MM/YY -->
                        <div class="col-md-6">
                            <label class="form-label required">Expiry (MM/YY) *</label>
                            <input type="text" class="form-control" id="expiry" name="expiry"
                                   placeholder="MM/YY" required
                                   autocomplete="cc-exp" inputmode="numeric"
                                   maxlength="5"/>
                        </div>

                        <!-- CVV -->
                        <div class="col-md-6">
                            <label class="form-label required">CVV *</label>
                            <input type="text" class="form-control" id="cvv" name="cvv"
                                   placeholder="123" required
                                   autocomplete="cc-csc" inputmode="numeric"
                                   maxlength="4"/>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Credit Card</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Credit card JS -->
    <script th:inline="javascript">
        window.CC_MESSAGES = {
            cardNumberEmpty: 'Please enter a card number.',
            cardNumberInvalid: 'Please enter a valid credit card number.',
            cardNumberLength: 'Card number length is invalid for {0}.',
            cardNameEmpty: 'Please enter the cardholder name.',
            expiryFormat: 'Please enter expiry in MM/YY format.',
            expiryMonth: 'Month must be between 01 and 12.',
            expiryExpired: 'Card is expired.',
            expiryFuture: 'Expiry date is too far in the future.',
            cvvLength: 'CVV must be {0} digits.'
        };
    </script>
    <script th:src="@{/assets/js/credit-card.js}"></script>
    <script>
        (function() {
            var modalEl = document.getElementById('creditCardFormModal');
            var modal = new bootstrap.Modal(modalEl);
            modal.show();
            // Clean up DOM when hidden
            modalEl.addEventListener('hidden.bs.modal', function () {
                modalEl.remove();
            });
        })();
    </script>
</div>
