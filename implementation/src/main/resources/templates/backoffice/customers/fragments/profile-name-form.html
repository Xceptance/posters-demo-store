<div th:fragment="profile-name-form" class="modal fade" id="profileNameFormModal" tabindex="-1" aria-labelledby="profileNameFormModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="profileNameFormModalLabel">Edit Profile Name</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            
            <div th:fragment="conflict-error" th:if="${error != null}">
                <div class="modal-body pb-0">
                    <div class="alert alert-danger py-2 mb-0">
                        <span class="material-symbols-outlined align-middle me-1" style="font-size: 1.2rem;">warning</span>
                        <span th:text="${error}">An error occurred</span>
                    </div>
                </div>
            </div>
            
            <form method="post" th:hx-post="@{/backoffice/customers/{id}/edit-name(id=${customer.id})}"
                  hx-target="#profile-name-container"
                  hx-swap="outerHTML"
                  hx-on::after-request="if(event.detail.successful) bootstrap.Modal.getInstance(document.getElementById('profileNameFormModal')).hide()">
                  
                <div class="modal-body">
                    <!-- Hidden Version Field for Optimistic Locking -->
                    <input type="hidden" name="version" th:value="${customer.version}" />
                    
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label for="firstName" class="form-label form-label-sm text-muted">First Name *</label>
                            <input type="text" class="form-control form-control-sm" id="firstName" name="firstName" th:value="${customer.firstName}" required>
                        </div>
                        <div class="col-md-4">
                            <label for="middleName" class="form-label form-label-sm text-muted">Middle Name</label>
                            <input type="text" class="form-control form-control-sm" id="middleName" name="middleName" placeholder="Optional" th:value="${customer.middleName}">
                        </div>
                        <div class="col-md-4">
                            <label for="lastName" class="form-label form-label-sm text-muted">Last Name *</label>
                            <input type="text" class="form-control form-control-sm" id="lastName" name="lastName" th:value="${customer.lastName}" required>
                        </div>
                    </div>
                </div>
                
                <div class="modal-footer">
                    <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-sm btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
    <script>
        (function() {
            var modalEl = document.getElementById('profileNameFormModal');
            var modal = new bootstrap.Modal(modalEl);
            modal.show();
            // Clean up DOM when hidden
            modalEl.addEventListener('hidden.bs.modal', function () {
                modalEl.remove();
            });
        })();
    </script>
</div>
