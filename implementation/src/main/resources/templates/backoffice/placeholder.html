<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{backoffice/layout/default}">
<head>
    <title th:text="${moduleTitle} + ' - Backoffice'">Coming Soon - Backoffice</title>
</head>
<body>
    <div layout:fragment="pageTitle" th:text="${moduleTitle}">Coming Soon</div>
    <div layout:fragment="content">
        <div class="d-flex flex-column align-items-center justify-content-center" style="min-height: 300px;">
            <span class="material-symbols-outlined text-muted" style="font-size: 4rem;" th:text="${moduleIcon ?: 'construction'}">construction</span>
            <h3 class="mt-3 mb-2 text-muted">Coming Soon</h3>
            <p class="text-muted" th:text="${moduleTitle} + ' will be available in a future update.'">This module will be available in a future update.</p>
        </div>
    </div>
</body>
</html>
