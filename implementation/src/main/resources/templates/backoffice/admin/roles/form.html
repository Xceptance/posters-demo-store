<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{backoffice/layout/default}">
<head>
    <title th:text="${role.id != null ? 'Edit Role' : 'New Role'} + ' - Backoffice'">Role Form - Backoffice</title>
</head>
<body>
    <div layout:fragment="pageTitle" th:text="${role.id != null ? 'Edit Role' : 'New Role'}">Role Form</div>
    <div layout:fragment="content">

        <!-- Flash messages -->
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="row">
            <div class="col-lg-8">
                <div class="bo-module-card">
                    <form method="post"
                          th:action="${role.id != null
                              ? @{/backoffice/security/roles/{id}(id=${role.id})}
                              : @{/backoffice/security/roles}}">

                        <div class="mb-3">
                            <label class="form-label">Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" name="name"
                                   th:value="${role.name}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <input type="text" class="form-control" name="description"
                                   th:value="${role.description}">
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Module Access</label>
                            <div th:each="entry : ${allModules}" class="form-check">
                                <input class="form-check-input" type="checkbox" name="moduleIds"
                                       th:value="${entry.key}"
                                       th:id="'module-' + ${entry.key}"
                                       th:checked="${role.moduleIds != null && role.moduleIds.contains(entry.key)}">
                                <label class="form-check-label" th:for="'module-' + ${entry.key}">
                                    <span th:text="${entry.value}"></span>
                                </label>
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <span th:text="${role.id != null ? 'Update Role' : 'Create Role'}"></span>
                            </button>
                            <a th:href="@{/backoffice/security/roles}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>

    </div>
</body>
</html>
