# ============================================================================
# AI Test Automation - Configuration
# ============================================================================

# Gemini LLM Settings
neodymium.ai.apiKey=${GEMINI_API_KEY}
neodymium.ai.model=gemini-2.5-flash

# Agent Settings
neodymium.ai.agent.maxRetries=3
neodymium.ai.agent.screenshotBeforeAction=false

# LLM Settings
neodymium.ai.generate.validations = false
neodymium.ai.temperature = 0.0

neodymium.ai.report.attachFullDiscussion = true

neodymium.ai.pesap.enabled=true
neodymium.ai.pesap.custom.file = config/pesap-custom-rules.md