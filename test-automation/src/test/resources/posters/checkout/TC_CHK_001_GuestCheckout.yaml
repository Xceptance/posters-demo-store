context: >
  If you cannot find an element or make sense our of names, try to translate the user supplied data into the language behind ${locale}. 
  Additionally all user translatable data is formatted like this translate('NAME').

prompt: |
  Open ${neodymium.url}
  Click the country selector button.
  Click the country represented by locale '${locale}' in the opened dialog.
  Navigate to the product detail page for any product.
  Select a size and style and click the Add to Cart button.
  Close the mini-cart if it is open.
  Verify the count shown next to the cart icon is  '1'.
  Open the mini-cart and click translate("View Cart"). 
  Click translate("Checkout").
  Verify the user is taken into the checkout.
  Verify the user is presented with the Shipping Address form.
  Fill out the shipping address form using: First Name '${firstName}', Last Name '${lastName}', Company '${company}', Address '${address}', City '${city}', State '${state}', Zip '${zip}', Country translate('${country})'.
  Submit the shipping address form.
  Verify the billing address form is displayed.
  Select "Use shipping address for billing" and submit the form.
  Verify the Payment method or Order Review step is displayed.
  Select credit card as the payment method, enter the card details: Name '${firstName} ${lastName}', Card '${creditCard}', Exp Month '${expMonth}', Exp Year '${expYear}', CVV '112' and proceed.
  Verify the Order Review/Summary page is displayed.
  Review the totals and click "Place Order".
  Verify the user is redirected to the Order Confirmation page, and an order number is displayed.

