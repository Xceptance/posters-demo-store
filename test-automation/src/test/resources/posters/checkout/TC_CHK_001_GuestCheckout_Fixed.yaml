skipReplay: true

context: |
  * You are testing a localized version of the posters web shop indicated by ${locale}. 
  * If you cannot find an element or make sense out of names, try to translate supplied data.
  * Additionally all translatable data is hinted by translate('NAME') but not necessarily always so. 
  * All numbers are formatted according to the locale (currency, decimal separator, etc.).
  * CRITICAL RULE: NEVER assert that the 'body' contains English text (like 'Review Order' or 'Summary') when testing localized pages. For page verification, rely ONLY on the current URL, specific form elements, or the exact translated headings you can visually confirm in the provided DOM snippet.

steps: |
  # Homepage
  Open ${neodymium.url}.
  Click the country selector button.
  Click the country represented by locale '${locale}' in the opened dialog.
  # Search & PDP
  Search for '${searchQuery}' using the search bar.
  Click on '${productName}' from the search results to open the product details page.
  # PDP
  Select size '${size}' and finish '${finish}'.
  Click the Add to Cart button (hint: #btn-add-to-cart).
  If the mini-cart is open then close it.
  Verify the count shown next to the cart icon is '1'.
  Open the mini-cart and click translate("View Cart"). 
  # Cart Page
  Verify the tax rate is displayed in the cart summary. FAIL the test if the tax rate is not displayed in the exact format '${taxRate}' (two decimal places required). The decimal separator depends on the locale.
  Click translate("Checkout").
  # Checkout
  Verify the user is taken into the checkout.
  Verify the user is presented with the Shipping Address form.
  Fill out the shipping address form using: First Name '${firstName}', Last Name '${lastName}', Company '${company}', Address '${address}', City '${city}', State '${state}', Zip '${zip}'.
  Select the country translate('${country}') from the country dropdown in the shipping address form.
  Submit the shipping address form.
  # Billing Address
  Verify the billing address form is displayed.
  Select translate("Use shipping address for billing") and submit the form.
  # Payment
  Verify the payment form is displayed.
  Enter '${creditCard}' into the card number field.
  Enter '${firstName} ${lastName}' into the cardholder name field.
  Enter '${expiry}' into the expiry field (MM/YY format).
  Enter '${cvv}' into the CVV field.
  Submit the payment form.
  # Order Review
  Verify that an order review page is displayed.
  Verify that the displayed subtotal is '${expectedSubtotal}'.
  Verify that the displayed shipping is '${expectedShipping}'.
  Verify that the displayed tax rate is '${taxRate}'.
  Verify that the displayed tax is '${expectedTax}'.
  Verify that the displayed total is '${expectedTotal}'.
  Verify that a translate("Place Order") button is visible.
  Click translate("Place Order").
  # Order Confirmation
  Verify that an order confirmation page is displayed.
  Verify that a non-empty order ID is shown (format: ORD-[0-9]{10,15}).
  Verify that the subtotal shown on the confirmation page is '${expectedSubtotal}'.
  Verify that the tax shown on the confirmation page is '${expectedTax}'.
  Verify that the shipping shown on the confirmation page is '${expectedShipping}'.
  Verify that the total shown on the confirmation page is '${expectedTotal}'.
  Verify that the tax rate displayed on the confirmation page is '${taxRate}'.

