prompt: |
  Open ${neodymium.url}
  Click the country selector button.
  Click the country represented by locale '${locale}' in the opened dialog.
  Type '${partialTerm}' into the search field and submit.
  Verify the search results page loads without errors.
  Verify that at least ${minExpectedResults} product tiles are displayed.
  Verify that the products '${expectedProduct1}' and '${expectedProduct2}' appear in the results, if provided.
  If '${testSingleChar}' is 'true', type 'b' into the search field and submit, and verify the search returns results without errors.

data:
