steps: |
  Open ${neodymium.url}
  Click the country selector button.
  Click the country represented by locale 'en-US' in the opened dialog.
  Type '${searchTerm}' into the search field and submit.
  Verify the search completes without a server error (no 500 error page or stack trace) and without timing out.
  Verify the results page loads properly.
  If the input contains script tags, verify that no JavaScript alert dialog appears and that the page renders normally with the input escaped/sanitized in the heading.

