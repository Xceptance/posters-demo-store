steps: |
  Open ${neodymium.url}
  Click the country selector button.
  Click the country represented by locale '${locale}' in the opened dialog.
  Type '${searchTerm}' into the search field and submit.
  Verify the search results page displays an empty state with a search icon, a "No products found" (localized) message, and a "Continue Shopping" link.
  Verify that no product tiles are displayed on the page.

