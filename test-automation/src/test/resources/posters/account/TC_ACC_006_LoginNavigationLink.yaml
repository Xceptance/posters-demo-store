# Neodymium AI Playbook
# Automated from manual test: TC_ACC_006
steps: |
  Open ${neodymium.url}
  Click the country selector button.
  Click the country represented by locale '${locale}' in the opened dialog.
  Click the profile/sign-in icon at the top right.
  Click 'Create Account' to navigate to Create Account page.
  Click the 'Don't have an account?' link to navigate to the Registration page (bug).

  # Step 1: Click Login Link
  Locate and click the "Already have an account?" link or the "Sign In" link inside the registration card.
  Verify that you are redirected to the Login page and the URL contains "/login".
  Verify that the sign-in/login form is visible on the page.

