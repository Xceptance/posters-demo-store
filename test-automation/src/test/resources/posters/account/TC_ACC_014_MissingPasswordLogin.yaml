# Neodymium AI Playbook
# Automated from manual test: TC_ACC_014
steps: |
  Open ${neodymium.url}
  Click the country selector button.
  Click the country represented by locale '${locale}' in the opened dialog.
  Click the profile/sign-in icon at the top right to go to the Sign In page.
  
  # Step 1: Enter email, leave password empty and click Sign In
  Type '${email}' into the Email field.
  Click the 'Sign In' button.
  
  # Step 2: Verify native browser overlay pointing to Password
  Verify that the form is not submitted.
  Verify that a browser validation error popup/tooltip pointing to the Password field is shown with message containing "Please fill out this field" or localized equivalent.

