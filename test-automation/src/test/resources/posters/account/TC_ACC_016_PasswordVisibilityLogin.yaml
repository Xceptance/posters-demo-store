# Neodymium AI Playbook
# Automated from manual test: TC_ACC_016
steps: |
  Open ${neodymium.url}
  Click the country selector button.
  Click the country represented by locale '${locale}' in the opened dialog.
  Click the profile/sign-in icon at the top right to go to the Sign In page.

  # Step 1: Enter Password and Verify it is masked
  Type '${password}' into the Password field.
  Verify that the password input element has type attribute equal to "password".
  Verify that the icon next to the password input fields is an open eye icon (visual).

  # Step 2: Toggle Visibility On
  Click the show/hide password toggle button or eye icon next to the Password field.
  Verify that the icon next to the password input fields is a strike-through eye icon (visual).
  Verify that the password input element has type attribute equal to "text".

  # Step 3: Toggle Visibility Off
  Click the show/hide password toggle button or eye icon next to the Password field again.
  Verify that the password input element has type attribute equal to "password".
  Verify that the icon next to the password input fields is an open eye icon (visual).

