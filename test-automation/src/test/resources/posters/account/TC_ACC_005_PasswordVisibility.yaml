# Neodymium AI Playbook
# Automated from manual test: TC_ACC_005
#skipReplay: true

steps: |
  Open ${posters.storefront.url}
  Click the country selector button.
  Click the country represented by locale '${locale}' in the opened dialog.
  Click the profile/sign-in icon at the top right and click 'Create Account'.

  # Step 1: Enter Password and Verify it is masked
  Type '${password}' into the Password field.
  Verify that the password input element has a type attribute equal to "password".
  Verify that you don't see the password (visual) but just dots.
  Verify that the icon next to the password input field is an open eye icon (visual).

  # Step 2: Toggle Visibility On
  Click the show/hide password toggle button/eye icon next to the password input field.
  Verify that the icon next to the password input field is a strike-through eye icon (visual).
  Verify that the type attribute of the password fields is 'text'.

  # Step 3: Toggle Visibility Off
  Click the show/hide password toggle button or eye icon next to the Password field again.
  Verify that the password input element's type attribute has the value "password".
  Verify that the icon next to the password input field is an open eye icon (visual).

