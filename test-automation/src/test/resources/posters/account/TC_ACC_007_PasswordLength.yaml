# Neodymium AI Playbook
# Automated from manual test: TC_ACC_007
steps: |
  Open ${neodymium.url}
  Click the country selector button.
  Click the country represented by locale '${locale}' in the opened dialog.
  Click the profile/sign-in icon at the top right, then click 'Sign In' or 'Registration' to navigate to the Login or Create Account page.
  If not already on the Registration page, click the 'Don't have an account?' link to navigate to the Registration page.
  
  # Step 1: Fill Valid Form Data
  Type '${firstName}' into the First Name field.
  Type '${lastName}' into the Last Name field.
  Type '${randomEmail}' into the Email field.

  # Step 2: Test Too Short Password (Below Minimum Boundary)
  Type '${tooShortPassword}' into the Password field.
  Click 'Create Account'.
  Verify that the form is not submitted and a browser validation error popup/tooltip pointing to the Password field is shown, indicating a minlength error or asking to lengthen the text.

  # Step 3: Test Boundary Minimum Password (Exactly 6 Characters)
  Clear the Password field.
  Type '${boundaryPassword}' into the Password field.
  Click 'Create Account'.
  Verify that you are registered successfully and redirected to the homepage.

