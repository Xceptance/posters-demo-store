
prompt: |
  Open ${neodymium.url}
  Click the user menu icon
  Click the Create Account link
  Type '${lastName}' into the Last Name field
  Type '${firstName}' into the First Name field
  Type '${email}' into the Email Address field
  Type '${password}' into the Password field
  Type '${password}' into the Confirm Password field
  Click the Create Account button
  Type '${email}' into the Email Address field
  Type '${password}' into the Password field
  Click the Sign In button
  Click the The Poster Demo Store link
  Click the Buy Here button for the Blue Morpho Butterfly product
  Click the Add To Cart button
  Click the Cart icon
  Click the View Cart link
  Click the Proceed To Checkout button
  Type '${firstName}' into the First Name field
  Type '${lastName}' into the Last Name field
  Type '${addressLine}' into the Street Address field
  Type '${city}' into the City field
  Type '${state}' into the State/Province field
  Type '${zipCode}' into the ZIP/Postal Code field
  Select '${country}' from the Country dropdown
  Click the Continue button
  Type '${creditCardNumber}' into the Card Number field
  Type '${cardHolderName}' into the Cardholder's Name field
  Select '${expirationMonth}' from the Expiration Date month dropdown
  Select '${expirationYear}' from the Expiration Date year dropdown
  Click the Continue button
  Click the Order With Costs button

after:
  - Click the user menu
  - Click the My Account link
  - Click the Personal Data link
  - Click the Delete Your Account button
  - Type '${password}' into the Password field
  - Click the Delete button to confirm account deletion

data:
  - testId: "placeRegisteredOrder"
    lastName: "Doep"
    firstName: "Jane"
    email: "${testId}_${firstName}@example.com"
    password: "Test12345!"
    addressLine: "123 Main St"
    city: "Anytown"
    state: "CA"
    zipCode: "90210"
    country: "United States"
    creditCardNumber: "4111111111111111"
    cardHolderName: "${firstName} ${lastName}"
    expirationMonth: "12"
    expirationYear: "2030"
