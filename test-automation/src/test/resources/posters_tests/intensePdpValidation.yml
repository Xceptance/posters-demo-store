prompt: |
  Open ${neodymium.url}
  Search for '${searchTerm}'.
  Click the second product in the grid.
  Verify the product detail page shows Product Name: '${searchTerm}'.
  Verify the product detail page shows price starting with '${currencySymbol}'
  Verify the product detail page shows an 'Add To Cart' button that is enabled
  Verify the product detail page shows a product description section

data:
  - testId: "intensePdpValidation_case1"
    searchTerm: "Boston"
    currencySymbol: "$"
